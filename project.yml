name: MusicPlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  MusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Managers
      - path: Models
      - path: Player
      - path: Views
      - path: Icon
      - path: Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicplayer
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MusicPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MusicPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicplayer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MusicPlayer.app/MusicPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MusicPlayer:
    build:
      targets:
        MusicPlayer: all
        MusicPlayerTests: [test]
    test:
      targets:
        - MusicPlayerTests
